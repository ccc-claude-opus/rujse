[package]
name = "wasmbench-boa"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# The same engine and features as rubrowser's js.wasm.
boa_engine = { version = "0.22", default-features = false, features = ["annex-b"] }
getrandom03 = { package = "getrandom", version = "0.3", default-features = false }
